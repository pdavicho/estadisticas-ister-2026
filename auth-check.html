<script>
(function() {
  var path = window.location.pathname;

  // No proteger login ni recursos estáticos
  if (path.indexOf('login.html') !== -1 ||
      /\.(css|js|png|jpg|woff2?|ttf|eot|ico|svg|json|map)$/i.test(path)) {
    return;
  }

  var token = sessionStorage.getItem('HE_auth_token');
  if (token === 'HEstadisticas_Ister_2026') return;

  // Calcular ruta absoluta a login.html
  // GitHub Pages proyecto: /repo-name/path/to/page.html  → root en /repo-name/
  // Local / raíz:          /path/to/page.html            → root en /
  var segments = path.split('/');
  // segments[0] siempre '' (antes del primer /)
  // segments[1] = repo name en GitHub Pages proyecto, o primer directorio
  // segments[N] = filename

  var isGitHubPages = window.location.hostname.endsWith('.github.io');
  // En project pages el repo ocupa segments[1], así que el sitio empieza en segments[2]
  var siteDepth = isGitHubPages ? 2 : 1;

  // Nivel del archivo dentro del sitio (cuántos directorios hay que subir)
  var fileDepth = segments.length - 1 - siteDepth; // descontamos '' + repo + filename
  if (fileDepth < 0) fileDepth = 0;

  var goUp = '';
  for (var i = 0; i < fileDepth; i++) { goUp += '../'; }

  window.location.replace(goUp + 'login.html');
})();
</script>
